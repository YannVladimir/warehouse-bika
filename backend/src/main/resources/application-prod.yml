# Activated via SPRING_PROFILES_ACTIVE=prod. Overrides the dev-friendly defaults in application.yml
# with settings that fail fast instead of silently falling back to something insecure -- a missing
# env var here should break the deploy, not quietly ship with the dev JWT secret or an open CORS
# wildcard.
app:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.bika.archive: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
